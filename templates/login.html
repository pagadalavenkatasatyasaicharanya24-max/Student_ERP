<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student ERP | Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #1e3a8a, #2563eb, #60a5fa);

        position: relative;
        overflow: hidden;
      }

      /* Decorative circles */

      body::before {
        content: "";
        position: absolute;

        width: 350px;
        height: 350px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.12);

        top: -120px;
        left: -100px;
      }

      body::after {
        content: "";
        position: absolute;

        width: 450px;
        height: 450px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.1);

        bottom: -180px;
        right: -130px;
      }

      /* Main login card */

      .login-container {
        width: 400px;

        padding: 40px;

        background: rgba(255, 255, 255, 0.96);

        border-radius: 20px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

        position: relative;
        z-index: 2;

        animation: appear 0.6s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(25px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Logo */

      .logo {
        width: 75px;
        height: 75px;

        margin: 0 auto 15px;

        border-radius: 50%;

        background: linear-gradient(135deg, #1e3a8a, #2563eb);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 35px;

        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      }

      /* Heading */

      .title {
        text-align: center;

        color: #172554;

        font-size: 30px;

        font-weight: 700;

        margin-bottom: 5px;
      }

      .subtitle {
        text-align: center;

        color: #64748b;

        font-size: 14px;

        margin-bottom: 30px;
      }

      /* Error message */

      .error {
        background: #fee2e2;

        color: #b91c1c;

        padding: 11px;

        border-radius: 8px;

        margin-bottom: 20px;

        text-align: center;

        font-size: 14px;
      }

      /* Form */

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        color: #334155;

        font-size: 14px;

        font-weight: 600;
      }

      /* Input wrapper */

      .input-box {
        position: relative;
      }

      .input-icon {
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        font-size: 18px;
      }

      input {
        width: 100%;

        padding: 13px 45px;

        border: 1px solid #cbd5e1;

        border-radius: 10px;

        font-size: 15px;

        outline: none;

        transition: 0.3s;

        background: #f8fafc;
      }

      input:focus {
        border-color: #2563eb;

        background: white;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      /* Show password */

      .show-password {
        position: absolute;

        right: 14px;
        top: 50%;

        transform: translateY(-50%);

        cursor: pointer;

        font-size: 17px;
      }

      /* Login button */

      button {
        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(135deg, #1e3a8a, #2563eb);

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;

        box-shadow: 0 7px 18px rgba(37, 99, 235, 0.3);
      }

      button:hover {
        transform: translateY(-2px);

        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      }

      /* Footer */

      .footer {
        text-align: center;

        margin-top: 25px;

        color: #94a3b8;

        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <!-- Logo -->

      <div class="logo">🎓</div>

      <!-- Title -->

      <h1 class="title">Student ERP</h1>

      <p class="subtitle">Student Management Portal</p>

      <!-- Error -->

      {% if error %}

      <div class="error">{{ error }}</div>

      {% endif %}

      <!-- Login Form -->

      <form method="POST">
        <!-- Student ID -->

        <div class="form-group">
          <label for="student_id"> Student ID </label>

          <div class="input-box">
            <span class="input-icon"> 👤 </span>

            <input
              type="text"
              id="student_id"
              name="student_id"
              placeholder="Enter your Student ID"
              required
            />
          </div>
        </div>

        <!-- Password -->

        <div class="form-group">
          <label for="password"> Password </label>

          <div class="input-box">
            <span class="input-icon"> 🔒 </span>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />

            <span class="show-password" onclick="togglePassword()"> 👁️ </span>
          </div>
        </div>

        <!-- Login -->

        <button type="submit">Login</button>
      </form>

      <div class="footer">© 2026 Student ERP Portal</div>
    </div>

    <script>
      function togglePassword() {
        const password = document.getElementById("password");

        if (password.type === "password") {
          password.type = "text";
        } else {
          password.type = "password";
        }
      }
    </script>
  </body>
</html>
