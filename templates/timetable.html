<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student ERP | Timetable</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}"
    />
  </head>

  <body>
    <div class="dashboard-container">
      <header class="dashboard-header">
        <div>
          <h1>Student ERP</h1>
          <p>Class Timetable</p>
        </div>

        <a href="/dashboard" class="logout-btn"> Dashboard </a>
      </header>

      <main class="dashboard-content">
        <h2>My Timetable 🗓️</h2>

        <p class="welcome-text">View your weekly class schedule.</p>

        <div class="student-info">
          <h3>Semester 5 Timetable</h3>

          {% for record in timetable_data %}

          <p>
            <strong>{{ record.day }}:</strong>

            {{ record.subject_name }} — {{ record.start_time }} to {{
            record.end_time }}
          </p>

          {% endfor %}
        </div>
      </main>
    </div>
  </body>
</html>
